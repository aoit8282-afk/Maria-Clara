<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>

    <h1>preencha o formulário Formulário</h1>

    <label for="nome"nome>Nome:</label>
    <input type="text" id="nome" name="nome"><br><br>

    <label for="tel">Telefone:</label>
    <input type="tel" id="contato" class="contato" name="contato"><br><br>

    <label for="email">email:</label>
    <input type="email" id="email" name="email"><br><br>

    <label for="sim">deseja receber nossas mensagens?</label>
    <br>
   
    
    <input type="radio" id="sim" name="sim" value="positivo"> <name="sim"> <label for="sim">Sim</label>
    <input type="radio" id="nao" name="nao" value="negativo"><name="nao"></name><label for="nao">Não</label> <br>

    <label for="mensagem"></label>
    <textarea id="mensagem" class="mensagem" name="mensagem" rows="5" cols="50" placeholder="Digite sua mensagem aqui..."></textarea><br><br>

    <input type="submit" id="url" class="url" name="url">
    
</body>
</html>
