<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inputs</title>
    <style>
        #titulogeral{
            font-family: Arial, Helvetica, sans-serif;
        }
        


    </style>


</head>
<body>
    <h1 id="titulogeral" class="titulogeral">Lista de inputs - HTML</h1>
<br><br>
    <form action="">

    <label for="nome">
    <input type="text" id="nome" name="nome"><br><br>

    <label for="senha">senha:</label>
    <input type="password" id="senha" name="senha"><br><br>

    <label for="cpf">CPF:</label>
    <input type="number" id="cpf" name="cpf"><br><br>

    <label for="email">email:</label>
    <input type="email" id="email" name="email"><br><br>

    <label for="datanascimento">Data de Nascimento:</label>
    <input type="date" id="datanascimento" name="datanascimento"><br><br>

    <label for="cor">Cor do veículo:</label>
    <input type="color" id="cor" name="cor"><br><br>

    <label for="hora">Hora:</label>
    <input type="time" id="hora" name="hora"><br><br>

    <label for="diadasemana">Dia da semana:</label>
    <input type="week" id="diadasemana" name="diadasemana"><br><br>

    <label for="masculino">Masculino:</label>
    <input type="radio" id="masculino" name="sexo" value="masculino"> <name="sexo"><br><br>
    <label for="feminino">Feminino:</label>
    <input type="radio" id="feminino" name="sexo" value="feminino"><br><br>

    <label for="analista">Função:</label>
    <input type="text" id="analista" name="analista"><br><br>

    <label for="gerente">Gerente de tecnologia:</label>
    <input type="checkbox" class="gsti" name="funcao" id="gsti"><br><br>

    <label for="vol">Volume:</label>
    <input type="range" id="vol" name="vol"><br><br>

    <label for="arquivo">escolha um formato de Arquivo: .png, .jpg, .gif, .pdf, .jpg</label>
    <input type="file" id="arquivo" name="arquivo" accept=".png,.jpg,.gif,.pdf"><br><br>

    <label for="busca">pesquisar:</label>
    <input type="search" id="busca" class="busca" ><br><br>

    <label for="url">URL:</label>
    <input type="url" id="url" class="url" name="url"><br><br>

    <label for="tel">Telefone:</label>
    <input type="tel" id="contato" class="contato" name="contato"><br><br>

        <label for="estado">escolha seu estados:</label>
        <select name="opcoes" id="opcoes">
            <option value="" disabled selected>Opções de estados:</option>
            <option value="opcao1">MG</option>
            <option value="opcao2">SP</option>
            <option value="opcao3">RJ</option><br><br>
        </select><br><br>

        <label for="mensagem">mensagem:</label>
        <textarea id="mensagem" class="mensagem" name="mensagem" rows="5" cols="50" placeholder="Digite sua mensagem aqui..."></textarea><br><br>

    <input type="submit" id="url" class="url" name="url">
    <input type="reset" id="reset" class="reset" name="limpar capos"><br><br>
    


</form>
</body>
</html>
