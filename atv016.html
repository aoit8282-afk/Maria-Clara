<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 3 </title>
</head>
<body>

    <h1>preencha o formulário Formulário</h1>
    
    <label for="nome"nome>insira seu nome:</label>
    <input type="text" id="nome" name="nome"><br><br>

    <label for="sobrenome">digite seu sobrenome:</label>
    <input type="text" id="sobrenome" name="sobrenome"><br><br>

    <label for="sexo">selecione seu sexo:</label>
    <input type="radio" id="masculino" name="sexo" value="masculino"> <label for="masculino">Masculino</label>
    <input type="radio" id="feminino" name="sexo" value="feminino"> <label for="feminino">Feminino</label><br><br>
    <input type="radio" id="naodeclarado" name="sexo" value="naodeclarado"> <label for="naodeclarado">Prefiro não declarar</label><br><br>

    <label for="asp.net">ASP.NET</label>
    <input type="checkbox" class="gsti" name="funcao" id="gsti"><br><br>
    
    
    
    
    
    
    <label for="opcoes">escolha a opção do seu interesse:</label>
        <select name="opcoes" id="opcoes">
            <option value="" disabled selected>Opções de linguagens:</option>
            <option value="opcao1">asp.net</option>
            <option value="opcao2">Python</option>
            <option value="opcao3">JavaScript</option>
            <option value="opcao4">Java</option><br><br>

    <label for="mensagem">digite sua mensagem:</label>
    <textarea id="mensagem" name="mensagem" rows="5" cols="50" placeholder="Digite sua mensagem aqui..."></textarea><br><br>    

</body>
</html>
